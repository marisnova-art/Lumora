<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumora Studio</title>
<meta name="description" content="Lumora Studio — shoot with live filters, grade photos non-destructively and edit video in your browser.">
<meta name="theme-color" content="#0c0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
/* ── Deployment configuration ─────────────────────────────────────────────
   Public values only. The anon key is designed to be public; Row Level Security
   protects the data. NEVER put the service_role key or payment/AI secrets here.
   Leave empty to run in Local mode (or set them later in Settings → Backend). */
window.LUMORA_CONFIG = { supabaseUrl: '', supabaseAnonKey: '' };
</script>
<style>
/* ===================== Lumora Studio — Design System ===================== */
:root{
  --bg:#0c0d10; --bg2:#121419; --surface:#171a20; --surface2:#1e222a; --surface3:#272c36;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#f2f3f6; --text2:#b7bcc8; --muted:#7d8394;
  --accent:#b9a8ff; --accent2:#9fd8ff; --accent-ink:#14111f;
  --accent-soft:rgba(185,168,255,.14);
  --amber:#e9a73b; --amber-ink:#1b1206;
  --ok:#5fd6a0; --warn:#ffc35c; --bad:#ff6f7d;
  --radius:14px; --radius-sm:10px; --radius-lg:22px;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --font:'Pretendard Variable',Pretendard,'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:'Instrument Serif','Times New Roman',serif;
  --nav-h:64px; --hdr-h:60px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f5f2; --bg2:#ecece8; --surface:#ffffff; --surface2:#f1f1ee; --surface3:#e4e4df;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.15);
  --text:#15161a; --text2:#3f4350; --muted:#7a7f8c;
  --accent:#6b55e6; --accent2:#2a8fd0; --accent-ink:#ffffff; --accent-soft:rgba(107,85,230,.10);
  --shadow:0 18px 40px rgba(20,20,30,.12);
  --warn:#8a5a00; --ok:#1f8a5b; --bad:#c62f42;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img,canvas,video{display:block;max-width:100%}
::selection{background:var(--accent);color:var(--accent-ink)}
.mono{font-family:var(--mono);font-feature-settings:"zero" 1}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.muted{color:var(--muted)} .t2{color:var(--text2)} .small{font-size:12.5px} .tiny{font-size:11px}
.row{display:flex;align-items:center;gap:10px} .col{display:flex;flex-direction:column;gap:10px}
.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .between{justify-content:space-between}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- App shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:40;height:calc(var(--hdr-h) + var(--safe-t));padding:var(--safe-t) 18px 0;display:flex;align-items:center;gap:14px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.logo-mark{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 210deg,var(--accent),var(--accent2),#ffd1a1,var(--accent));position:relative}
.logo-mark::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.logo b{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:0}
.logo span{font-size:11px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
.hdr-nav{display:none;gap:4px;margin-left:14px}
.hdr-nav a{padding:8px 13px;border-radius:999px;color:var(--text2);font-size:14px}
.hdr-nav a.on{background:var(--surface2);color:var(--text)}
.hdr-search{flex:1;max-width:420px;margin-left:auto;position:relative}
.hdr-search+.hdr-actions{margin-left:0}
.hdr-search input{width:100%;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 38px;outline:none}
.hdr-search input:focus{border-color:var(--accent)}
.hdr-search svg{position:absolute;left:13px;top:11px;opacity:.6}
.hdr-actions{display:flex;gap:6px;align-items:center;margin-left:auto}
main#view{flex:1;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px)}
.page{max-width:1280px;margin:0 auto;padding:18px 16px 30px}
.page-narrow{max-width:760px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);transition:transform .25s}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.bnav a.on{color:var(--text)} .bnav a.on svg{stroke:var(--accent)}
.bnav a.navcam .cam-dot{width:44px;height:30px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.bnav a.navcam .cam-dot svg{stroke:var(--accent-ink)}
body.immersive .bnav{transform:translateY(110%)}
body.immersive .hdr{display:none}
body.immersive main#view{padding-bottom:0}
@media (min-width:1024px){
  .hdr-nav{display:flex} .bnav{display:none} main#view{padding-bottom:0}
  .page{padding:28px 28px 60px}
}
@media (max-width:640px){ .hdr-search{display:none} .hdr-search+.hdr-actions{margin-left:auto} .hdr{padding-left:14px;padding-right:10px} .logo span{display:none} }

/* ---------- Primitives ---------- */
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.s{width:16px;height:16px} .ico.l{width:24px;height:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{background:var(--surface2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--text);color:var(--bg);border-color:transparent}
.btn.primary:hover{opacity:.9}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.xs{height:26px;padding:0 9px;font-size:12px}
.btn.block{width:100%}
.ibtn{width:38px;height:38px;border-radius:999px;border:0;background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn:hover{background:var(--surface2)} .ibtn.on{background:var(--accent-soft);color:var(--accent)}
.ibtn:disabled{opacity:.35;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text2);font-size:13px;cursor:pointer;white-space:nowrap;flex:none}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface3);color:var(--text2)}
.badge.free{background:rgba(95,214,160,.14);color:var(--ok)}
.badge.pro{background:linear-gradient(90deg,rgba(185,168,255,.25),rgba(159,216,255,.25));color:var(--accent)}
.badge.ai{background:rgba(255,195,92,.15);color:var(--warn)}
.badge.test{background:rgba(255,111,125,.15);color:var(--bad)}
.badge.off{background:var(--surface3);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px}
.sec-h h2{margin:0;font-size:19px;letter-spacing:-.01em}
.sec-h h2 .serif{font-size:25px}
.sec-h a{font-size:13px;color:var(--muted)}
h1.title{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.01em}
.lead{color:var(--text2);margin:0 0 18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--text2);font-weight:600}
.inp,select.inp,textarea.inp{height:42px;border-radius:var(--radius-sm);border:1px solid var(--line2);background:var(--bg2);padding:0 12px;outline:none;width:100%}
textarea.inp{height:auto;min-height:90px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.inp:focus{border-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--text);font-size:13px;line-height:1.5}
.notice.warn{background:rgba(255,195,92,.12)} .notice.bad{background:rgba(255,111,125,.12)} .notice.ok{background:rgba(95,214,160,.12)}
.notice .ico{margin-top:1px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface2);gap:2px}
.seg button{height:30px;padding:0 13px;border:0;border-radius:999px;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:6px;border-radius:9px;background:var(--surface3);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:10px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:color-mix(in srgb,var(--surface2) 50%,transparent)}
.tbl-wrap{overflow-x:auto}

/* ---------- Sliders (label + value above, full-width track) ---------- */
.sl{padding:7px 0 9px}
.sl-top{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;margin-bottom:6px;color:var(--text2);user-select:none}
.sl-top .v{font-family:var(--mono);font-size:12px;color:var(--text);min-width:44px;text-align:right;cursor:pointer;padding:1px 6px;border-radius:6px}
.sl-top .v.chg{color:var(--accent)}
.sl-top .v:hover{background:var(--surface2)}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
.sl input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--line2),var(--line2))}
.sl input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--line2)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--text);margin-top:-8.5px;box-shadow:0 0 0 4px var(--bg),0 2px 6px rgba(0,0,0,.4)}
.sl input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--text)}
.sl.bip input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--line2) 0 49.6%,var(--muted) 49.6% 50.4%,var(--line2) 50.4%)}
.grp-h{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px;display:flex;justify-content:space-between;align-items:center}
.grp-h:first-child{margin-top:4px}

/* ---------- Modal / sheet / toast ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.modal{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px 18px calc(18px + var(--safe-b));box-shadow:var(--shadow);animation:up .22s cubic-bezier(.2,.8,.2,1)}
.modal h3{margin:0 0 6px;font-size:18px}
.modal.wide{max-width:900px}
@media (min-width:720px){.overlay{align-items:center}.modal{border-radius:var(--radius-lg)}}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:0}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 14px);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);animation:up .2s;pointer-events:auto;display:flex;gap:10px;align-items:center}
.toast.bad{background:var(--bad);color:#fff}
@media (min-width:1024px){#toasts{bottom:24px}}

/* ---------- Home ---------- */
.hero{position:relative;border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:16/10;background:var(--surface2)}
@media(min-width:760px){.hero{aspect-ratio:21/8}}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;display:flex;align-items:flex-end}
.hero-slide.on{opacity:1}
.hero-slide canvas,.hero-slide img,.hero-slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-slide::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.72))}
.hero-copy{position:relative;z-index:2;padding:22px;color:#fff;max-width:640px}
.hero-copy .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.hero-copy h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,54px);line-height:1;margin:6px 0 8px}
.hero-copy p{margin:0 0 14px;opacity:.86;font-size:14px}
.hero-copy .btn{background:#fff;color:#111;border:0}
.hero-dots{position:absolute;right:18px;bottom:18px;z-index:3;display:flex;gap:6px}
.hero-dots i{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.4);cursor:pointer;transition:width .3s}
.hero-dots i.on{width:22px;background:#fff}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
@media(min-width:760px){.quick{grid-template-columns:repeat(9,minmax(0,1fr))}}
.qa{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:14px;padding:14px 13px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,transform .15s;min-height:96px}
.qa:hover{border-color:var(--line2);transform:translateY(-1px)}
.qa .qi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2)}
.qa b{font-size:13px;font-weight:600;line-height:1.25}
.qa.hl .qi{background:var(--accent);color:var(--accent-ink)}

/* ---------- Preset cards ---------- */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.pgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.pcard{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column}
.pcard .th{aspect-ratio:4/5;background:var(--surface2);position:relative;overflow:hidden}
.pcard .th img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pcard:hover .th img{transform:scale(1.04)}
.pcard .meta{padding:10px 11px 11px;display:flex;flex-direction:column;gap:4px}
.pcard .meta b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .meta .row{gap:6px}
.pcard .fav{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.42);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.pcard .fav.on svg{fill:#ff8fa3;stroke:#ff8fa3}
.pcard .apply{position:absolute;left:8px;bottom:8px;height:28px;padding:0 11px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:#111;font-size:12px;font-weight:700;cursor:pointer;opacity:0;transform:translateY(6px);transition:.2s}
.pcard:hover .apply,.pcard:focus-within .apply{opacity:1;transform:none}
@media(hover:none){.pcard .apply{opacity:1;transform:none}}
.hscroll .pcard{width:150px}
@media(min-width:760px){.hscroll .pcard{width:180px}}

/* ---------- Studio hub ---------- */
.hub{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.hub{grid-template-columns:repeat(2,1fr)}}
.hub-card{position:relative;min-height:150px;padding:20px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end}
.hub-card canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hub-card>*:not(canvas){position:relative}
.hub-card h3{font-family:var(--serif);font-weight:400;font-size:30px;margin:0}
.dropzone{border:1.5px dashed var(--line2);border-radius:var(--radius-lg);padding:28px;text-align:center;color:var(--text2);transition:.15s}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- Editor (photo + video) ---------- */
.editor{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;
  grid-template-rows:calc(52px + var(--safe-t)) minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
  grid-template-areas:"top" "stage" "dock"}
.ed-top{grid-area:top;display:flex;align-items:center;gap:4px;padding:var(--safe-t) 8px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.ed-top .ttl{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.ed-stage{grid-area:stage;position:relative;overflow:hidden;background:
  repeating-conic-gradient(var(--bg2) 0 25%,var(--bg) 0 50%) 0 0/22px 22px;touch-action:none}
.ed-canvas-wrap{position:absolute;left:50%;top:50%;transform-origin:0 0;will-change:transform}
.ed-canvas-wrap canvas{box-shadow:0 10px 50px rgba(0,0,0,.5);max-width:none}

.crop-box{position:absolute;border:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5);z-index:3;touch-action:none;cursor:move}

  background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.35) 33.3% 33.5%,transparent 33.6% 66.5%,rgba(255,255,255,.35) 66.6% 66.8%,transparent 66.9%)}
.crop-box::after{background:linear-gradient(180deg,transparent 33.2%,rgba(255,255,255,.35) 33.3% 33.5%,transparent 33.6% 66.5%,rgba(255,255,255,.35) 66.6% 66.8%,transparent 66.9%)}
@media(max-width:640px){.hide-sm{display:none}}

.crop-box i.sw{left:-3px;bottom:-3px;border-right:0;border-top:0;cursor:nesw-resize}
.crop-box i.se{right:-3px;bottom:-3px;border-left:0;border-top:0;cursor:nwse-resize}
.split-line{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:3;cursor:ew-resize;touch-action:none}

.hist-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--text2)}
.hist-item:hover{background:var(--surface2)} .hist-item.on{background:var(--accent-soft);color:var(--text)} .hist-item.fut{opacity:.45}

/* ---------- Video timeline ---------- */
.tl{grid-area:tl;background:var(--bg2);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}

.tl.mobile{grid-area:auto}
.vclips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px}
.vclip{flex:none;width:96px;border-radius:10px;overflow:hidden;background:var(--surface2);border:2px solid transparent;cursor:pointer;font-size:10.5px}
.vclip.on{border-color:var(--accent)}
.vclip img{width:100%;aspect-ratio:16/10;object-fit:cover}
.vclip div{padding:4px 6px;font-family:var(--mono);color:var(--text2)}
.transport{display:flex;align-items:center;gap:8px;padding:6px 12px;font-family:var(--mono);font-size:12px}
.transport input[type=range]{flex:1;accent-color:var(--amber)}

/* ---------- Camera ---------- */
.cam{position:fixed;inset:0;z-index:35;background:#000;color:#f4f1ea;display:flex;flex-direction:column;overflow:hidden}

.cam-grid{position:absolute;pointer-events:none;z-index:3;
  background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.35) 33.33%,transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.35) 66.66%,transparent calc(66.66% + .5px)),
  linear-gradient(180deg,transparent calc(33.33% - .5px),rgba(255,255,255,.35) 33.33%,transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.35) 66.66%,transparent calc(66.66% + .5px))}
.cam-count{position:absolute;z-index:6;font-family:var(--mono);font-size:120px;font-weight:700;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6)}

.readout .cell{text-align:center;min-width:0}

.meter{display:flex;align-items:center;gap:5px;font-family:var(--mono)}

.dials{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 6px;gap:8px}

function parseCube(text){

/* ===================== Core: utils, icons, data layer, router ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const fmtBytes=b=>{if(b==null)return'—';const u=['B','KB','MB','GB'];let i=0;while(b>=1024&&i<3){b/=1024;i++}return(i?b.toFixed(1):b)+' '+u[i]};
const fmtTime=s=>{s=Math.max(0,s||0);const m=Math.floor(s/60),ss=Math.floor(s%60),cs=Math.floor((s%1)*10);return`${m}:${String(ss).padStart(2,'0')}.${cs}`};
const fmtDate=d=>{try{return new Date(d).toLocaleDateString(I18N.lang==='ko'?'ko-KR':'en-US',{year:'numeric',month:'short',day:'numeric'})}catch{return d}};
const fmtMoney=(n,cur)=>{try{return new Intl.NumberFormat(I18N.lang==='ko'?'ko-KR':'en-US',{style:'currency',currency:cur||App.settings.currency||'USD'}).format(n||0)}catch{return(n||0)+' '+(cur||'')}};
const isMobile=()=>matchMedia('(max-width:1023px)').matches;
const L=o=>o==null?'':typeof o==='string'?o:(o[I18N.lang]||o.en||Object.values(o)[0]||'');
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function pickFiles(accept,multiple){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multiple;i.onchange=()=>res([...i.files]);i.click()})}

function modal(inner,opts={}){
  const ov=el(`<div class="overlay"><div class="modal ${opts.wide?'wide':''}" role="dialog" aria-modal="true">${inner}</div></div>`);
  document.body.appendChild(ov); const m=ov.firstElementChild;

  ov.addEventListener('pointerdown',e=>{if(e.target===ov&&!opts.sticky)close()});
  $$('[data-close]',m).forEach(b=>b.onclick=()=>close());

}

function slider({label,min=-100,max=100,step=1,value=0,def=0,fmt,onInput,onChange,bip}){
  const w=el(`<div class="sl ${bip??(min<0)?'bip':''}"><div class="sl-top"><span>${esc(label)}</span><span class="v" title="${esc(t('common.resetValue'))}"></span></div><input type="range" min="${min}" max="${max}" step="${step}"></div>`);
  const r=$('input',w), v=$('.v',w); const show=x=>{v.textContent=fmt?fmt(+x):(+x>0&&min<0?'+':'')+(+x).toFixed(step<1?(step<.1?2:1):0);v.classList.toggle('chg',+x!==def)};
  r.value=value; show(value);
  r.oninput=()=>{show(r.value);onInput&&onInput(+r.value)};
  r.onchange=()=>onChange&&onChange(+r.value);
  const reset=()=>{r.value=def;show(def);onInput&&onInput(def);onChange&&onChange(def)};
  v.onclick=reset; r.ondblclick=reset;
  w.set=x=>{r.value=x;show(x)}; return w;
}

/* ---------- Local database (used when Supabase is not configured) ----------
   Implements the subset of the supabase-js query builder used by the app so all code paths are identical. */
const LocalDB={
  key:t=>'lumora.ldb.'+t,
  read(t){try{return JSON.parse(localStorage.getItem(this.key(t))||'[]')}catch{return[]}},
  write(t,rows){try{localStorage.setItem(this.key(t),JSON.stringify(rows))}catch(e){toast(t('err.storageFull'),'bad')}},
  pk:t=>({presets:'preset_id',preset_categories:'slug',app_settings:'key',translations:'id'}[t]||'id'),
  from(t){return new LQ(t)},
  seed(){
    if(localStorage.getItem('lumora.ldb.seeded')==='3') return;
    const now=Date.now();
    this.write('presets',SEED_PRESETS.map((p,i)=>({...p,created_at:new Date(now-i*86400000).toISOString(),updated_at:new Date(now-i*86400000).toISOString()})));
    this.write('preset_categories',SEED_CATEGORIES.map(c=>({...c})));
    this.write('banners',SEED_BANNERS); this.write('announcements',SEED_ANNOUNCEMENTS);
    this.write('app_settings',Object.entries(SEED_SETTINGS).map(([key,value])=>({key,value})));
    ['translations','preset_versions','usage_logs','donations','payment_transactions','subscriptions','ai_jobs','preset_favorites'].forEach(t=>{if(!localStorage.getItem(this.key(t)))this.write(t,[])});
    localStorage.setItem('lumora.ldb.seeded','3');
  }
};
class LQ{
  constructor(t){this.t=t;this.f=[];this.ord=[];this.rng=null;this.op='select';this.cnt=null;this.one=0;this.payload=null}
  select(c,o){if(o&&o.count)this.cnt=o.count;if(o&&o.head)this.head=true;return this}
  eq(c,v){this.f.push(r=>r[c]===v);return this} neq(c,v){this.f.push(r=>r[c]!==v);return this}
  in(c,a){this.f.push(r=>a.includes(r[c]));return this} gte(c,v){this.f.push(r=>r[c]>=v);return this} lte(c,v){this.f.push(r=>r[c]<=v);return this}
  is(c,v){this.f.push(r=>(r[c]??null)===v);return this}
  ilike(c,p){const re=new RegExp('^'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*')+'$','i');this.f.push(r=>re.test(typeof r[c]==='object'?JSON.stringify(r[c]):String(r[c]??'')));return this}
  contains(c,a){this.f.push(r=>Array.isArray(r[c])&&a.every(x=>r[c].includes(x)));return this}
  or(expr){const parts=expr.split(/,(?![^{]*})/).map(p=>{const [c,op,...rest]=p.split('.');const v=rest.join('.');
      if(op==='ilike'){const re=new RegExp('^'+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*')+'$','i');return r=>re.test(typeof r[c]==='object'?JSON.stringify(r[c]):String(r[c]??''))}
      if(op==='cs'){const arr=v.replace(/[{}]/g,'').split(',');return r=>Array.isArray(r[c])&&arr.every(x=>r[c].includes(x))}
      if(op==='eq') return r=>String(r[c])===v; return ()=>false});
    this.f.push(r=>parts.some(fn=>fn(r)));return this}
  order(c,o={}){this.ord.push([c,o.ascending!==false]);return this} range(a,b){this.rng=[a,b];return this} limit(n){this.rng=[0,n-1];return this}
  single(){this.one=1;return this} maybeSingle(){this.one=2;return this}
  insert(r){this.op='insert';this.payload=r;return this} update(o){this.op='update';this.payload=o;return this}
  upsert(r,o){this.op='upsert';this.payload=r;this.conf=o&&o.onConflict;return this} delete(){this.op='delete';return this}
  then(res,rej){return Promise.resolve().then(()=>this._run()).then(res,rej)}
  _run(){
    const t=this.t, pk=LocalDB.pk(t); let rows=LocalDB.read(t); const now=new Date().toISOString(); const match=r=>this.f.every(fn=>fn(r));
    if(this.op==='insert'||this.op==='upsert'){
      const list=(Array.isArray(this.payload)?this.payload:[this.payload]).map(r=>({...r}));
      const key=this.conf||pk; const out=[];
      for(const r of list){ if(r[pk]==null&&pk==='id') r.id=uid(); if(!r.created_at)r.created_at=now; r.updated_at=now;
        const i=rows.findIndex(x=>x[key]!=null&&x[key]===r[key]);
        if(i>=0){ if(this.op==='insert') return {data:null,error:{message:'duplicate key: '+r[key]}}; rows[i]={...rows[i],...r}; out.push(rows[i]); } else { rows.push(r); out.push(r); } }
      LocalDB.write(t,rows); return this._shape(out);
    }
    if(this.op==='update'){const out=[];rows=rows.map(r=>{if(match(r)){const n={...r,...this.payload,updated_at:now};out.push(n);return n}return r});LocalDB.write(t,rows);return this._shape(out)}
    if(this.op==='delete'){const out=rows.filter(match);LocalDB.write(t,rows.filter(r=>!match(r)));return this._shape(out)}
    let data=rows.filter(match); const count=data.length;
    for(const [c,asc] of [...this.ord].reverse()) data.sort((a,b)=>{const x=a[c],y=b[c];return (x>y?1:x<y?-1:0)*(asc?1:-1)});
    if(this.rng) data=data.slice(this.rng[0],this.rng[1]+1);
    const r=this._shape(data); if(this.cnt) r.count=count; if(this.head) r.data=null; return r;
  }
  _shape(d){ if(this.one){ if(!d.length) return this.one===1?{data:null,error:{message:'Row not found',code:'PGRST116'}}:{data:null,error:null}; return {data:d[0],error:null} } return {data:d,error:null} }
}

/* ---------- IndexedDB: local projects & media blobs (originals are never modified) ---------- */
const IDB={
  _db:null,
  open(){ if(this._db) return Promise.resolve(this._db); return new Promise((res,rej)=>{ const r=indexedDB.open('lumora',2);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'project_id'});if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs')};
    r.onsuccess=()=>res(this._db=r.result); r.onerror=()=>rej(r.error); }) },
  async tx(store,mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})},
  async get(store,key){const d=await this.open();return new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async all(store){const d=await this.open();return new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
  put(store,val,key){return this.tx(store,'readwrite',s=>key!==undefined?s.put(val,key):s.put(val))},
  del(store,key){return this.tx(store,'readwrite',s=>s.delete(key))},
};
const Projects={
  async list(){const l=await IDB.all('projects');return l.sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||''))},
  get(id){return IDB.get('projects',id)},
  async save(p,blobs={}){p.updated_at=new Date().toISOString();p.created_at=p.created_at||p.updated_at;p.user_id=App.user?App.user.id:null;
    for(const [k,b] of Object.entries(blobs)) if(b) await IDB.put('blobs',b,p.project_id+':'+k);
    await IDB.put('projects',p); return p},
  blob(id,k){return IDB.get('blobs',id+':'+k)},
  async remove(id,withFiles=true){const p=await this.get(id); await IDB.del('projects',id); if(withFiles){for(const k of ['original','preview','thumb'])await IDB.del('blobs',id+':'+k).catch(()=>{});} return p},
  async usage(){const l=await IDB.all('projects');return l.reduce((a,p)=>a+(p.size||0),0)}
};

/* ---------- Supabase bootstrap ---------- */
const SUPABASE_JS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
async function initSupabase(){
  const {supabaseUrl,supabaseAnonKey}=App.cfg; if(!supabaseUrl||!supabaseAnonKey) return;
  try{
    const mod=await import(SUPABASE_JS);
    App.sb=mod.createClient(supabaseUrl,supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    App.mode='cloud';
    const {data}=await App.sb.auth.getSession(); await setUser(data.session&&data.session.user);
    App.sb.auth.onAuthStateChange(async(ev,session)=>{ await setUser(session&&session.user);
      if(ev==='PASSWORD_RECOVERY') location.hash='#/reset';
      renderShell(); if(['SIGNED_IN','SIGNED_OUT'].includes(ev)) route(); });
  }catch(e){ console.error(e); App.sb=null; App.mode='local'; App.sbError=String(e.message||e); }
}
async function setUser(u){
  App.user=u||null; App.profile=null; App.roles=[];
  if(!u||!App.sb) return;
  const [{data:p},{data:r}]=await Promise.all([App.sb.from('profiles').select('*').eq('id',u.id).maybeSingle(),App.sb.from('user_roles').select('role').eq('user_id',u.id)]);
  App.profile=p; App.roles=(r||[]).map(x=>x.role);
  if(p&&p.language&&!localStorage.getItem('lumora.lang')) I18N.set(p.language,false);
  if(p&&p.account_status==='suspended'){ toast(t('auth.suspended'),'bad',6000); }
  // merge remote favorites
  const {data:f}=await App.sb.from('preset_favorites').select('preset_id').eq('user_id',u.id); if(f){f.forEach(x=>App.favs.add(x.preset_id));saveFavs();}
}
async function loadSettings(){
  const {data}=await db('app_settings').select('*'); if(data) data.forEach(r=>App.settings[r.key]=r.value);
  const {data:c}=await db('preset_categories').select('*').eq('is_active',true).order('sort_order'); App.categories=c&&c.length?c:SEED_CATEGORIES;
  const {data:tr}=await db('translations').select('*'); if(tr) tr.forEach(r=>{ (I18N.over[r.lang]||(I18N.over[r.lang]={}))[r.key]=r.value; });
}

/* ---------- Plans / gating ---------- */
const PLAN_RANK={free:0,premium:1,ai_premium:2};
function hasPlan(min){ if(App.mode==='local') return min!=='ai_premium'; return (PLAN_RANK[App.plan]||0)>=PLAN_RANK[min]; }
function canUsePreset(p){ return !p.is_premium||hasPlan('premium'); }
function requirePlan(min,feature){ if(hasPlan(min)) return true;
  const m=modal(`<div class="row" style="gap:12px;margin-bottom:8px"><div class="qi" style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)">${icon('lock')}</div><div><h3>${t('gate.title')}</h3><div class="small t2">${esc(feature||'')}</div></div></div>

/* ---------- Presets: access + thumbnails ---------- */
const pName=p=>p?(L(p.name_i18n)||p.name):''; const pDesc=p=>p?(L(p.description_i18n)||p.description||''):'';
const catName=s=>{const c=App.categories.find(c=>c.slug===s)||SEED_CATEGORIES.find(c=>c.slug===s);return c?L(c.name):s};
function cachePresets(rows){(rows||[]).forEach(p=>App.pcache.set(p.preset_id,p))}
async function loadPresets({q='',cat='',tier='',sort='',page=0,size=24,ids=null,media=null,admin=false}={}){
  let qb=db('presets').select('*',{count:'exact'});
  if(!admin) qb=qb.eq('is_published',true);
  if(ids){ if(!ids.length) return {rows:[],count:0}; qb=qb.in('preset_id',ids); }
  const c=App.categories.find(x=>x.slug===cat);
  if(cat&&(!c||c.kind!=='dynamic')) qb=qb.eq('category',cat);
  if(cat==='trending') qb=qb.eq('is_featured',true);
  if(tier==='free') qb=qb.eq('is_premium',false); else if(tier==='premium') qb=qb.eq('is_premium',true);
  if(media) qb=qb.contains('supported_media',[media]);
  if(q){const s=q.replace(/[%,(){}.]/g,' ').trim().toLowerCase(); if(s) qb=App.sb?qb.ilike('search_text',`%${s}%`):qb.or(`name.ilike.%${s}%,description.ilike.%${s}%,name_i18n.ilike.%${s}%,category.ilike.%${s}%,tags.cs.{${s}}`);}
  const sk=sort||(cat==='new'?'new':cat==='popular'||cat==='trending'?'popular':'');
  if(sk==='new') qb=qb.order('created_at',{ascending:false}); else if(sk==='popular') qb=qb.order('usage_count',{ascending:false}); else if(sk==='name') qb=qb.order('name');
  else qb=qb.order('sort_order');
  qb=qb.range(page*size,page*size+size-1);
  const {data,error,count}=await qb; if(error){console.warn(error);toast(error.message,'bad');return{rows:[],count:0}}
  cachePresets(data); try{ if(!q&&!cat&&!page&&!admin) localStorage.setItem('lumora.presetCache',JSON.stringify(data.slice(0,60))) }catch{}
  return {rows:data||[],count:count||0};
}
async function getPreset(id){ if(App.pcache.has(id)) return App.pcache.get(id); const {data}=await db('presets').select('*').eq('preset_id',id).maybeSingle(); if(data) cachePresets([data]); return data; }
function saveFavs(){localStorage.setItem('lumora.favs',JSON.stringify([...App.favs]))}
async function toggleFav(id){ const on=!App.favs.has(id); on?App.favs.add(id):App.favs.delete(id); saveFavs();
  if(App.sb&&App.user){ if(on) await App.sb.from('preset_favorites').upsert({user_id:App.user.id,preset_id:id},{onConflict:'user_id,preset_id'}); else await App.sb.from('preset_favorites').delete().eq('user_id',App.user.id).eq('preset_id',id); }
  return on; }
function markRecent(id){ App.recent=[id,...App.recent.filter(x=>x!==id)].slice(0,20); localStorage.setItem('lumora.recent',JSON.stringify(App.recent)); rpc('increment_preset_usage',{p_preset_id:id}); }

const Thumbs={
  cache:new Map(), q:[], busy:false, eng:null, samples:[],
  init(){ if(this.eng) return true; try{ const c=document.createElement('canvas'); c.width=200;c.height=250; this.eng=new LumaEngine(c,{preserve:true});
      this.samples=[makeSampleScene(400,500,0),makeSampleScene(400,500,1)]; this.cur=-1; return true }catch(e){ console.warn('thumb engine',e); return false } },
  key:p=>p.preset_id+':'+p.version+':'+(p.updated_at||''),
  get(p){ if(p.thumbnail_url) return Promise.resolve(p.thumbnail_url); const k=this.key(p); if(this.cache.has(k)) return Promise.resolve(this.cache.get(k));
    return new Promise(res=>{this.q.push({p,res,k});this.pump()}) },
  async pump(){ if(this.busy) return; this.busy=true;
    while(this.q.length){ const {p,res,k}=this.q.shift(); if(this.cache.has(k)){res(this.cache.get(k));continue}
      if(!this.init()){res('');continue}
      const v=p.category==='portrait'?1:0; if(this.cur!==v){this.eng.setSource(this.samples[v],400,500,true);this.cur=v}
      try{ this.eng.render(normalizeParams(p.parameters),{width:200,height:250,time:1}); const url=this.eng.canvas.toDataURL('image/jpeg',.8); this.cache.set(k,url); this.persist(); res(url);}catch(e){console.warn(e);res('')}
      await new Promise(r=>window.requestIdleCallback?requestIdleCallback(()=>r(),{timeout:120}):setTimeout(r,16)); }
    this.busy=false; },
  load(){ try{ const o=JSON.parse(localStorage.getItem('lumora.thumbs')||'{}'); Object.entries(o).forEach(([k,v])=>this.cache.set(k,v)); }catch{} },
  persist:debounce(function(){ try{ const e=[...Thumbs.cache.entries()].slice(-150); localStorage.setItem('lumora.thumbs',JSON.stringify(Object.fromEntries(e))); }catch{ try{localStorage.removeItem('lumora.thumbs')}catch{} } },1500),
  io:null,
  observe(root){ if(!this.io) this.io=new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; const img=e.target; this.io.unobserve(img);
      const p=App.pcache.get(img.dataset.thumb); if(p) this.get(p).then(u=>{if(u)img.src=u}); }),{rootMargin:'200px'});
    $$('img[data-thumb]',root).forEach(i=>{ if(!i.src||i.src===location.href) this.io.observe(i) }); }
};

function presetCard(p){
  return `<div class="pcard" data-pid="${esc(p.preset_id)}" tabindex="0">
    <div class="th"><img data-thumb="${esc(p.preset_id)}" alt="${esc(pName(p))}" loading="lazy">
      <button class="fav ${App.favs.has(p.preset_id)?'on':''}" data-fav="${esc(p.preset_id)}" aria-label="${t('preset.favorite')}">${icon('heart','s')}</button>
      <button class="apply" data-apply="${esc(p.preset_id)}">${t('preset.apply')}</button></div>
    <div class="meta"><b>${esc(pName(p))}</b><div class="row"><span class="small muted">${esc(catName(p.category))}</span>${p.is_premium?`<span class="badge pro">PRO</span>`:`<span class="badge free">FREE</span>`}${p.effect_type==='stylize'?`<span class="badge off">${t('preset.localFilter')}</span>`:''}</div></div></div>`;
}
function bindPresetCards(root){
  Thumbs.observe(root);
  root.addEventListener('click',async e=>{
    const f=e.target.closest('[data-fav]'); if(f){ e.stopPropagation(); const on=await toggleFav(f.dataset.fav); f.classList.toggle('on',on); toast(on?t('preset.favAdded'):t('preset.favRemoved')); return; }
    const a=e.target.closest('[data-apply]'); if(a){ e.stopPropagation(); applyPresetFlow(a.dataset.apply); return; }
    const c=e.target.closest('[data-pid]'); if(c) location.hash='#/preset/'+encodeURIComponent(c.dataset.pid);
  });
}
async function applyPresetFlow(id,target){
  const p=await getPreset(id); if(!p) return;
  if(!canUsePreset(p)){ requirePlan('premium',pName(p)); return; }
  const tgt=target||(Photo.items.length?'photo':Video.clips.length?'video':null);
  if(tgt==='photo'||tgt==='video'||tgt==='camera'){ App.handoff={preset:p}; location.hash='#/'+tgt; return; }
  const m=modal(`<h3>${t('preset.applyTo',{name:esc(pName(p))})}</h3><p class="small t2">${t('preset.applyToBody')}</p>
    <div class="col" style="margin-top:12px">
      <button class="btn block" data-t="camera">${icon('camera')} ${t('quick.takePhoto')}</button>
      <button class="btn block" data-t="photo-pick">${icon('image')} ${t('quick.editPhoto')}</button>
      <button class="btn block" data-t="photo-sample">${icon('sparkle')} ${t('preset.trySample')}</button>
      ${p.supported_media.includes('video')?`<button class="btn block" data-t="video-pick">${icon('video')} ${t('quick.editVideo')}</button>`:''}
    </div>`);
  m.el.onclick=async e=>{const b=e.target.closest('[data-t]');if(!b)return;m.close();const k=b.dataset.t;
    App.handoff={preset:p};
    if(k==='camera') location.hash='#/camera';
    if(k==='photo-sample'){App.handoff.sample=true;location.hash='#/photo'}
    if(k==='photo-pick'){const f=await pickFiles('image/*',true);if(f.length){App.handoff.files=f;location.hash='#/photo'}}
    if(k==='video-pick'){const f=await pickFiles('video/*');if(f.length){App.handoff.files=f;location.hash='#/video'}}};
}

const ROUTES={};
function parseHash(){ const h=(location.hash||'#/home').slice(2); const [path,qs]=h.split('?'); return {path:path||'home',parts:(path||'home').split('/'),query:Object.fromEntries(new URLSearchParams(qs||''))}; }
async function route(){
  const r=parseHash(); App.route=r.path;
  if(App.cleanup){ try{ await App.cleanup(); }catch(e){console.warn(e)} App.cleanup=null; }
  document.body.classList.remove('immersive'); $$('.overlay').forEach(o=>o.remove());
  const key=r.parts[0]==='admin'?'admin':r.parts[0]; const fn=ROUTES[key]||ROUTES.home;
  const view=$('#view'); view.innerHTML=''; window.scrollTo(0,0);

function bindDrop(dz,onFiles){
  const go=files=>{ if(onFiles) return onFiles(files); const img=files.filter(f=>f.type.startsWith('image/')||/\.(heic|heif|avif)$/i.test(f.name)), vid=files.filter(f=>f.type.startsWith('video/'));

  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
  dz.addEventListener('drop',e=>go([...e.dataTransfer.files]));
  dz.addEventListener('click',async e=>{ if(e.target.closest('button'))return; const f=await pickFiles('image/*,video/*,.heic,.heif',true); if(f.length) go(f); });
}

/* Before/after compare widget rendered with the engine */
async function compareWidget(container,srcCanvas,params){
  const w=srcCanvas.width,h=srcCanvas.height; const glc=document.createElement('canvas'); let eng;
  try{ eng=new LumaEngine(glc,{preserve:true}); }catch(e){ container.innerHTML=`<div class="notice bad">${t('err.webgl')}</div>`; return; }
  eng.setSource(srcCanvas,w,h,true);
  const mk=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
  const after=mk(), before=mk();
  eng.render(normalizeParams(params),{width:w,height:h,time:1}); after.getContext('2d').drawImage(glc,0,0);
  eng.render(defaultParams(),{width:w,height:h}); before.getContext('2d').drawImage(glc,0,0);
  container.innerHTML=''; const wrap=el(`<div class="compare"><div class="orig"></div><div class="split-line" style="left:50%"></div><span class="split-tag" style="left:10px">${t('editor.before')}</span><span class="split-tag" style="right:10px">${t('editor.after')}</span></div>`);
  wrap.prepend(after); $('.orig',wrap).appendChild(before); container.appendChild(wrap);
  const line=$('.split-line',wrap), orig=$('.orig',wrap);
  const set=x=>{const r=wrap.getBoundingClientRect();const f=clamp((x-r.left)/r.width,0,1);line.style.left=f*100+'%';orig.style.clipPath=`inset(0 ${(1-f)*100}% 0 0)`};
  wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture(e.pointerId);set(e.clientX);wrap.onpointermove=ev=>set(ev.clientX)});
  wrap.addEventListener('pointerup',()=>wrap.onpointermove=null);
  eng.dispose();
}

/* ---------- Image converter (batch, client-side) ---------- */
function canEncode(type){ const c=document.createElement('canvas');c.width=c.height=2; return c.toDataURL(type).startsWith('data:'+type); }
async function decodeImage(file){
  try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){
    if(/heic|heif/i.test(file.type)||/\.(heic|heif)$/i.test(file.name)){
      if(!window.heic2any){ toast(t('photo.heicLoading')); await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';s.onload=res;s.onerror=()=>rej(new Error(t('photo.heicFail')));document.head.appendChild(s)}); }
      const out=await window.heic2any({blob:file,toType:'image/jpeg',quality:.95}); return await createImageBitmap(Array.isArray(out)?out[0]:out);
    }
    throw new Error(t('err.decode',{name:file.name}));
  }
}

function curveEditor(ctx){
  const w=el(`<div><div class="row between"><div id="cvch"></div><button class="btn xs" id="cvr">${t('common.reset')}</button></div><div class="curve-wrap"><canvas></canvas></div><p class="tiny muted" style="text-align:center">${t('color.curveHint')}</p></div>`);
  const cv=$('canvas',w); let ch='master'; let drag=-1; const hist=ctx.histogram?ctx.histogram():null;
  const col={master:'#e8e8ee',r:'#ff6b6b',g:'#5fd68a',b:'#5aa9ff'};
  $('#cvch',w).appendChild(seg([['master','RGB'],['r','R'],['g','G'],['b','B']],ch,v=>{ch=v;draw()}));
  const pts=()=>ctx.p().curves[ch];
  const draw=()=>{ const dpr=devicePixelRatio||1, S=cv.clientWidth*dpr||300; cv.width=cv.height=S; const x=cv.getContext('2d'); x.clearRect(0,0,S,S);
    if(hist){x.fillStyle='rgba(150,150,170,.18)';const mx=Math.max(...hist);for(let i=0;i<256;i++){const hh=hist[i]/mx*S*.9;x.fillRect(i/256*S,S-hh,S/256+1,hh)}}
    x.strokeStyle='rgba(128,128,140,.25)';x.lineWidth=1;for(let i=1;i<4;i++){x.beginPath();x.moveTo(i*S/4,0);x.lineTo(i*S/4,S);x.moveTo(0,i*S/4);x.lineTo(S,i*S/4);x.stroke()}
    x.beginPath();x.moveTo(0,S);x.lineTo(S,0);x.strokeStyle='rgba(128,128,140,.35)';x.stroke();
    const s=curveSamples(pts()); x.beginPath(); for(let i=0;i<256;i++){const px=i/255*S,py=S-s[i]*S;i?x.lineTo(px,py):x.moveTo(px,py)} x.strokeStyle=col[ch];x.lineWidth=2*dpr;x.stroke();
    pts().forEach(([a,b])=>{x.beginPath();x.arc(a*S,S-b*S,6*dpr,0,7);x.fillStyle=col[ch];x.fill();x.strokeStyle='#000';x.lineWidth=1.5;x.stroke()}); };
  const pos=e=>{const r=cv.getBoundingClientRect();return[clamp((e.clientX-r.left)/r.width,0,1),clamp(1-(e.clientY-r.top)/r.height,0,1),(e.clientY-r.top)/r.height]};
  cv.onpointerdown=e=>{ cv.setPointerCapture(e.pointerId); const [a,b]=pos(e); const P=pts(); let best=-1,bd=.06;
    P.forEach(([px,py],i)=>{const d=Math.hypot(px-a,py-b);if(d<bd){bd=d;best=i}});
    if(best<0){P.push([a,b]);P.sort((p,q)=>p[0]-q[0]);best=P.findIndex(p=>p[0]===a&&p[1]===b)}
    drag=best; draw(); ctx.render(); };
  cv.onpointermove=e=>{ if(drag<0) return; const P=pts(); const [a,b,raw]=pos(e);
    if(drag>0&&drag<P.length-1&&(raw<-.12||raw>1.12)){P.splice(drag,1);drag=-1;draw();ctx.render();return}
    const lo=drag>0?P[drag-1][0]+.01:0, hi=drag<P.length-1?P[drag+1][0]-.01:1;
    P[drag]=[drag===0?0:drag===P.length-1?1:clamp(a,lo,hi),b]; draw(); ctx.render(); };
  cv.onpointerup=()=>{ if(drag>=0) ctx.commit(t('color.curves')); drag=-1; };
  cv.ondblclick=e=>{const [a,b]=pos(e);const P=pts();const i=P.findIndex(([px,py])=>Math.hypot(px-a,py-b)<.05);if(i>0&&i<P.length-1){P.splice(i,1);draw();ctx.render();ctx.commit(t('color.curves'))}};
  $('#cvr',w).onclick=()=>{ctx.p().curves[ch]=[[0,0],[1,1]];draw();ctx.render();ctx.commit(t('color.curves'))};
  requestAnimationFrame(draw); return w;
}
function colorWheel(ctx,path,label){

    for(let a=0;a<360;a+=2){x.beginPath();x.moveTo(c,c);x.arc(c,c,R,(a-1)*Math.PI/180,(a+2)*Math.PI/180);x.closePath();const [r,g,b]=hsv2rgb(a,1,1);x.fillStyle=`rgb(${r*255|0},${g*255|0},${b*255|0})`;x.fill()}
    const rg=x.createRadialGradient(c,c,0,c,c,R);rg.addColorStop(0,'rgba(128,128,128,1)');rg.addColorStop(1,'rgba(128,128,128,0)');x.fillStyle=rg;x.beginPath();x.arc(c,c,R,0,7);x.fill();
    const v=getPath(ctx.p(),path); const an=v.h*Math.PI/180, rr=v.s/100*R; x.beginPath();x.arc(c+Math.cos(an)*rr,c-Math.sin(an)*rr,9,0,7);x.lineWidth=3;x.strokeStyle='#fff';x.stroke();x.lineWidth=1.5;x.strokeStyle='#000';x.stroke(); };

            else if(type===5){const p=t0+u32(vo);const a=u32(p),b=u32(p+4);out[nm]=nm==='ExposureTime'&&a<b?`1/${Math.round(b/a)}`:+(a/b).toFixed(2)} }

  }catch(e){} return null;
}

/* ===================== Video Editor ===================== */
const Video={
  file:null, url:'', name:'', meta:null, clips:[], sel:0, params:defaultParams(), hist:[], hi:0, preset:null, presetLog:[], id:null,
  eng:null, canvas:null, video:null, playing:false, seqT:0, raf:0, pps:60, tab:'edit', state:{}, thumbs:new Map(), tq:[], tbusy:false, exporting:null,

  async load(file,proj){

    this.file=file; this.url=URL.createObjectURL(file); this.name=(proj&&proj.project_name)||file.name.replace(/\.[^.]+$/,''); this.thumbs.clear();
    const v=document.createElement('video'); v.src=this.url; v.muted=true; v.playsInline=true; v.preload='auto';
    await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error(t('video.codecErr'))),15000); v.onloadedmetadata=()=>{clearTimeout(to);res()}; v.onerror=()=>{clearTimeout(to);rej(new Error(t('video.codecErr')))} });

    this.estimateFps();
  },
  snap(){return {params:cloneP(this.params),clips:cloneP(this.clips)}},
  commit(label){ this.hist=this.hist.slice(0,this.hi+1); this.hist.push({label,p:this.snap()}); if(this.hist.length>80)this.hist.shift(); this.hi=this.hist.length-1; this.updUndo(); this.autosave(); },
  restore(){ const s=this.hist[this.hi].p; this.params=cloneP(s.params); this.clips=cloneP(s.clips); this.sel=Math.min(this.sel,this.clips.length-1); this.updUndo(); this.buildPanel(); this.renderTL(); this.seek(Math.min(this.seqT,this.total)); this.autosave(); },
  undo(){ if(this.hi>0){this.hi--;this.restore()} }, redo(){ if(this.hi<this.hist.length-1){this.hi++;this.restore()} },
  updUndo(){ const u=$('#edUndo'),r=$('#edRedo'); if(u)u.disabled=this.hi<=0; if(r)r.disabled=this.hi>=this.hist.length-1; },
  autosave:debounce(()=>Video.save(true),1200),
  async save(silent){ if(!this.file) return; try{ const ex=await Projects.get(this.id);

      await Projects.save({project_id:this.id,project_name:this.name,media_type:'video',w:this.meta.w,h:this.meta.h,size:this.meta.size,meta:this.meta,edit_parameters:this.params,clips:this.clips,preset:this.preset,preset_log:this.presetLog,preset_ids:[...new Set(this.presetLog.map(x=>x.id))],project_version:1,thumb,cloud:ex&&ex.cloud||null,created_at:ex&&ex.created_at},ex?{}:{original:this.file});
      if(!silent) toast(t('projects.saved')); }catch(e){ console.warn(e); if(!silent) toast(e.message,'bad'); } },
  estimateFps(){ const v=document.createElement('video'); v.src=this.url; v.muted=true; v.playsInline=true; if(!v.requestVideoFrameCallback) return;

  async play(){ if(this.playing) return this.pause(); if(this.seqT>=this.total-.05) await this.seek(0);

        v.pause(); const ni=L.i+1; await this.seek(this.clipOffset(ni)); L=this.locate(this.seqT); v.playbackRate=L.c.speed; if(!this.playing) return; await v.play().catch(()=>{}); }

    this.raf=requestAnimationFrame(loop); },
  pause(){ this.playing=false; cancelAnimationFrame(this.raf); if(this.video) this.video.pause(); this.updTransport(); },
  updTransport(){ const tt=$('#vTime'); if(tt) tt.textContent=`${fmtTime(this.seqT)} / ${fmtTime(this.total)}`; const sc=$('#vScrub'); if(sc&&!sc._drag){sc.max=this.total;sc.value=this.seqT}
    const pb=$('#vPlay'); if(pb) pb.innerHTML=icon(this.playing?'pause':'play'); const ph=$('#tlPH'); if(ph) ph.style.left=(this.seqT*this.pps)+'px';
    $$('[data-ci]').forEach(e=>e.classList.toggle('on',+e.dataset.ci===this.sel)); },
  layout(){ const st=$('#edStage'); if(!st||!this.canvas) return; const c=this.canvas; const fit=Math.min((st.clientWidth-20)/c.width,(st.clientHeight-20)/c.height); c.style.width=c.width*fit+'px'; c.style.height=c.height*fit+'px'; $('#edWrap').style.transform='translate(-50%,-50%)'; },
  info(){ const i=$('#edInfo'); if(!i||!this.meta) return; const m=this.meta; i.innerHTML=`<span>${esc(m.name)}</span><span>${m.w}×${m.h}</span><span>${m.fps?m.fps+' fps ('+t('video.est')+')':'fps —'}</span><span>${fmtTime(m.duration)}</span><span>${fmtBytes(m.size)}</span><span>${t('video.clips',{n:this.clips.length})}</span><span>${t('video.out')} ${fmtTime(this.total)}</span>`; },
  /* ---------- thumbnails ---------- */
  thumb(time){ const k=Math.round(time*2)/2; if(this.thumbs.has(k)) return Promise.resolve(this.thumbs.get(k)); return new Promise(r=>{this.tq.push({k,r});this.pumpT()}); },
  async pumpT(){ if(this.tbusy) return; this.tbusy=true; if(!this.tv){ this.tv=document.createElement('video'); this.tv.muted=true; this.tv.playsInline=true; this.tv.preload='auto'; } if(this.tv.src!==this.url){ this.tv.src=this.url; await new Promise(r=>{this.tv.onloadeddata=r;setTimeout(r,3000)}); }
    const c=document.createElement('canvas'); const ar=this.meta.w/this.meta.h; c.height=72; c.width=Math.round(72*ar);

      await new Promise(res=>{ const d=()=>{this.tv.removeEventListener('seeked',d);res()}; this.tv.addEventListener('seeked',d); this.tv.currentTime=Math.min(k,this.meta.duration-.05); setTimeout(d,1500); });

      });
      let dragI=-1; scroll.addEventListener('dragstart',e=>{const c=e.target.closest('[data-ci]');if(c){dragI=+c.dataset.ci;e.dataTransfer.effectAllowed='move'}});

  },
  /* ---------- clip operations ---------- */

async function projectMenu(id){
  const p=await Projects.get(id); if(!p) return;
  const m=modal(`<h3>${esc(p.project_name)}</h3><div class="small muted">${p.media_type} · ${p.w}×${p.h} · ${fmtBytes(p.size)} · v${p.project_version}</div><div class="col" style="margin-top:12px">

    <button class="btn block" data-a="orig">${icon('download','s')} ${t('projects.downloadOriginal')}</button>
    <button class="btn block" data-a="json">${icon('file','s')} ${t('projects.exportJson')}</button>
    <button class="btn block" data-a="cloud">${icon('upload','s')} ${p.cloud?t('projects.resync'):t('projects.cloudSave')}</button>
    <button class="btn block danger" data-a="del">${icon('trash','s')} ${t('common.delete')}</button></div>`);
  m.el.onclick=async e=>{ const b=e.target.closest('[data-a]'); if(!b) return; m.close(); const a=b.dataset.a;
    if(a==='rename'){ const n=await promptDlg(t('projects.rename'),p.project_name); if(n){ p.project_name=n; await Projects.save(p); const it=Photo.items.find(i=>i.id===id); if(it) it.name=n; route(); } }
    if(a==='orig'){ const bl=await Projects.blob(id,'original'); if(bl) download(bl,(p.meta&&p.meta.name)||p.project_name); }
    if(a==='json') download(new Blob([JSON.stringify({...p,thumb:undefined},null,2)],{type:'application/json'}),p.project_name+'.project.json');
    if(a==='cloud'){ await cloudSync(id); route(); }
    if(a==='del'){ const r=await confirmDlg(t('projects.deleteTitle'),t('projects.deleteBody'),{danger:true,ok:t('common.delete'),checks:[{label:t('projects.deleteFiles'),checked:true},...(p.cloud?[{label:t('projects.deleteCloud'),checked:true}]:[])]});
      if(!r) return; if(p.cloud&&r.checks[1]) { try{ await cloudDelete(p); }catch(err){ toast(err.message,'bad'); return; } }
      await Projects.remove(id,r.checks[0]); Photo.items=Photo.items.filter(i=>i.id!==id); Photo.cur=0; if(Video.id===id){ Video.file=null; } toast(t('projects.deleted')); route(); } };
}
function quotaMB(){ const q=App.settings.quotas||{}; return App.plan==='ai_premium'?q.ai_premium_mb:App.plan==='premium'?q.premium_mb:q.free_mb; }
async function cloudUsage(){ const {data}=await App.sb.from('project_media').select('size_bytes').eq('user_id',App.user.id); return (data||[]).reduce((a,r)=>a+(+r.size_bytes||0),0); }
async function cloudSync(id){
  if(!App.sb){ toast(t('auth.needSupabaseShort'),'bad'); return; } if(!App.user){ App.afterLogin=location.hash; toast(t('auth.loginRequired')); location.hash='#/login'; return; }
  const p=await Projects.get(id); const orig=await Projects.blob(id,'original'); if(!p||!orig) return;
  const used=await cloudUsage(); const limit=(quotaMB()||200)*1048576; if(!p.cloud&&used+orig.size>limit){ toast(t('projects.quotaFull',{used:fmtBytes(used),limit:fmtBytes(limit)}),'bad',5000); return; }

function formModal(title,fields,vals={},opts={}){return new Promise(res=>{
  const f=fields.map(x=>{ const v=vals[x.k]; const id='f_'+x.k.replace(/\W/g,'_');
    if(x.type==='check') return `<label class="check" style="margin:6px 0 12px"><input type="checkbox" id="${id}" ${v?'checked':''}> ${esc(x.label)}</label>`;
    if(x.type==='select') return `<div class="field"><label>${esc(x.label)}</label><select class="inp" id="${id}">${x.options.map(([o,l])=>`<option value="${esc(o)}" ${String(o)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
    if(x.type==='textarea'||x.type==='json') return `<div class="field"><label>${esc(x.label)}</label><textarea class="inp" id="${id}" style="${x.type==='textarea'?'font-family:var(--font);':''}min-height:${x.rows||90}px">${esc(x.type==='json'?JSON.stringify(v??x.def??{},null,2):v??'')}</textarea></div>`;
    return `<div class="field"><label>${esc(x.label)}</label><input class="inp" id="${id}" type="${x.type||'text'}" value="${esc(v??'')}" ${x.ro?'readonly':''} ${x.req?'required':''}></div>`; }).join('');
  const m=modal(`<h3>${esc(title)}</h3><div style="margin-top:12px">${f}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-x>${t('common.cancel')}</button><button class="btn primary" data-ok>${t('common.save')}</button></div>`,{wide:opts.wide,onClose:v=>res(v??null)});
  $('[data-x]',m.el).onclick=()=>m.close(null);
  $('[data-ok]',m.el).onclick=()=>{ const out={}; try{ for(const x of fields){ const e=$('#f_'+x.k.replace(/\W/g,'_'),m.el); out[x.k]=x.type==='check'?e.checked:x.type==='number'?+e.value:x.type==='json'?JSON.parse(e.value||'null'):e.value.trim(); if(x.req&&!out[x.k]) throw new Error(x.label+' — '+t('admin.required')); } }catch(err){ toast(err.message,'bad'); return; } m.close(out); };
})}

function validatePreset(p){ if(!p||typeof p!=='object') return 'not an object'; if(!/^[a-z0-9][a-z0-9-_]{1,80}$/.test(p.preset_id||'')) return 'preset_id must be a lowercase slug'; if(!p.name) return 'name required'; if(!p.category) return 'category required';
  if(p.parameters!=null&&!isObj(p.parameters)) return 'parameters must be an object'; try{ normalizeParams(p.parameters) }catch(e){ return 'parameters invalid'; } return null; }
function sanitizePreset(p){ const allowed=['preset_id','name','name_i18n','description','description_i18n','category','subcategory','tags','thumbnail_url','preview_url','effect_type','parameters','supported_media','is_free','is_premium','is_published','is_featured','version','sort_order'];
  const o={}; allowed.forEach(k=>{ if(p[k]!==undefined) o[k]=p[k]; }); o.parameters=o.parameters||{}; o.supported_media=o.supported_media||['image','video','camera']; o.is_premium=!!o.is_premium; o.is_free=!o.is_premium; o.version=o.version||1; o.tags=o.tags||[]; o.effect_type=o.effect_type||'adjust'; return o; }

/* ---------- Revenue ---------- */
async function adminRevenue(host){
  const [{data:tx},{data:don},{data:subs}]=await Promise.all([db('payment_transactions').select('*').order('created_at',{ascending:false}).limit(500),db('donations').select('*').order('created_at',{ascending:false}).limit(500),db('subscriptions').select('*').limit(1000)]);
  const ok=x=>x.status==='succeeded'&&!x.is_test; const sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
  const months=[...Array(12)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-11+i);return d.toISOString().slice(0,7)});
  const byM=months.map(m=>sum((tx||[]).filter(x=>ok(x)&&String(x.created_at).startsWith(m)))); const max=Math.max(1,...byM);
  const act=(subs||[]).filter(s=>['active','trialing'].includes(s.status)&&!s.is_test);
  host.innerHTML=`<h1 class="title">${t('admin.revenue')}</h1>${App.mode==='local'?`<div class="notice warn" style="margin-bottom:12px">${icon('info')}<div>${t('admin.revLocal')}</div></div>`:''}
    <div class="stats"><div class="stat"><div class="k">${t('admin.totalDonations')}</div><div class="n">${fmtMoney(sum((don||[]).filter(ok)))}</div></div><div class="stat"><div class="k">${t('admin.subRevenue')}</div><div class="n">${fmtMoney(sum((tx||[]).filter(x=>ok(x)&&x.kind==='subscription')))}</div></div>
      <div class="stat"><div class="k">${t('admin.activeSubs')}</div><div class="n">${act.length}</div></div><div class="stat"><div class="k">${t('admin.testVolume')}</div><div class="n">${fmtMoney(sum([...(tx||[]),...(don||[])].filter(x=>x.is_test)))}</div></div></div>
    <div class="card pad" style="margin-top:14px"><div class="grp-h" style="margin-top:0">${t('admin.monthly')}</div><div class="bars">${byM.map((v,i)=>`<div><i style="height:${v/max*100}%" title="${fmtMoney(v)}"></i>${months[i].slice(5)}</div>`).join('')}</div></div>
    <div class="card pad" style="margin-top:14px"><div class="grp-h" style="margin-top:0">${t('admin.plansBreakdown')}</div><div class="row wrap">${['premium','ai_premium'].map(p=>`<span class="badge pro">${p}: ${act.filter(s=>s.plan===p).length}</span>`).join('')}</div></div>
    <div class="card tbl-wrap" style="margin-top:14px"><table class="tbl"><tr><th>${t('common.created')}</th><th>kind</th><th>${t('admin.amount')}</th><th>${t('common.status')}</th><th>provider</th><th>ref</th></tr>${[...(tx||[]),...(don||[]).map(d=>({...d,kind:'donation'}))].sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,30).map(x=>`<tr><td class="small">${fmtDate(x.created_at)}</td><td>${esc(x.kind)}</td><td class="mono">${fmtMoney(x.amount,x.currency)}</td><td><span class="badge">${esc(x.status)}</span>${x.is_test?' <span class="badge test">TEST</span>':''}</td><td class="small">${esc(x.provider||'')}</td><td class="mono tiny">${esc((x.provider_ref||'').slice(0,18))}</td></tr>`).join('')||`<tr><td colspan="6" class="empty small">${t('admin.noData')}</td></tr>`}</table></div>`;
}

/* ===================== Boot ===================== */
const APP_VERSION='1.0.0';
(async function boot(){
  const th=localStorage.getItem('lumora.theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'); document.documentElement.dataset.theme=th;
  I18N.init();
  LocalDB.seed(); Thumbs.load();
  try{ cachePresets(JSON.parse(localStorage.getItem('lumora.presetCache')||'[]')); }catch{}
  renderShell();
  await initSupabase();
  try{ await loadSettings(); }catch(e){ console.warn('settings',e); }
  renderShell();
  await route();
  window.addEventListener('lumora:glLost',()=>toast(t('err.glLost'),'bad',5000));
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{ const nw=reg.installing; nw&&nw.addEventListener('statechange',()=>{ if(nw.state==='installed'&&navigator.serviceWorker.controller){
        const tt=el(`<div class="toast">${esc(t('pwa.update'))} <button class="btn xs" style="background:var(--bg);color:var(--text)">${esc(t('pwa.reload'))}</button></div>`); $('#toasts').appendChild(tt); $('button',tt).onclick=()=>{ nw.postMessage('skipWaiting'); location.reload(); }; } }); });
    }).catch(e=>console.warn('sw',e));
  }
  addEventListener('online',()=>toast(t('net.online'))); addEventListener('offline',()=>toast(t('net.offline'),'bad'));
})();

</script>
